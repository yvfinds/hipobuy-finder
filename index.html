<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YV Finds | Best Clothing Finds</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #0f0f0f;
    color: white;
}

header {
    padding: 30px 20px;
    text-align: center;
    background: linear-gradient(135deg,#ff0055,#7000ff);
}

header h1 {
    font-size: 42px;
    margin: 0;
}

header p {
    font-size: 18px;
}

.search {
    margin: 20px auto;
    max-width: 500px;
}

.search input {
    width: 100%;
    padding: 15px;
    border-radius: 30px;
    border: none;
    font-size: 16px;
}

.container {
    padding: 20px;
    max-width: 1100px;
    margin: auto;
}

.categories {
    display: flex;
    gap: 10px;
    overflow-x: auto;
}

.category {
    background: #222;
    padding: 12px 20px;
    border-radius: 25px;
    white-space: nowrap;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
    gap: 20px;
    margin-top: 30px;
}

.card {
    background: #181818;
    border-radius: 20px;
    overflow: hidden;
    transition: .3s;
}

.card:hover {
    transform: translateY(-5px);
}

.card img {
    width: 100%;
    height: 280px;
    object-fit: cover;
}

.info {
    padding: 15px;
}

.tag {
    color: #ff3b8d;
}

.button {
    display: block;
    text-align: center;
    background: #ff0055;
    padding: 12px;
    border-radius: 25px;
    color:white;
    text-decoration:none;
    margin-top:15px;
}

footer {
    text-align:center;
    padding:30px;
    color:#888;
}
</style>

</head>
